version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      go-modules:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      web-app:
        update-types: [minor, patch]
    ignore:
      # Keep in step with the Playwright container tag in CLAUDE.md, so update it by hand.
      - dependency-name: "@playwright/test"
      # Majors of the framework and toolchain can break the build; update them by hand.
      - dependency-name: "@sveltejs/*"
        update-types: [version-update:semver-major]
      - dependency-name: svelte
        update-types: [version-update:semver-major]
      - dependency-name: vite
        update-types: [version-update:semver-major]
      - dependency-name: vitest
        update-types: [version-update:semver-major]
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
      - dependency-name: "@tailwindcss/vite"
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # The Node types' major is a deliberate choice; change it by hand.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]
